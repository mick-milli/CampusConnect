name: Supabase keep-alive

# Supabase free-tier projects auto-pause after 7 days with no database activity,
# which takes the whole app (login included) offline. This workflow runs a tiny
# read against the REST API on a schedule so the project never goes idle.

on:
  schedule:
    # 07:00 UTC daily. Daily (not weekly) gives plenty of margin: GitHub's cron
    # can be delayed or skipped under load, and we still want a hit well inside
    # the 7-day pause window.
    - cron: "0 7 * * *"
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY repo secret."
            exit 1
          fi
          # Strip any trailing slash, then read a single id — RLS blocks the anon
          # key, so we use the service_role key to guarantee a real DB query.
          base="${SUPABASE_URL%/}"
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$base/rest/v1/cc_categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "Supabase responded with HTTP $code"
          case "$code" in
            2*) echo "Keep-alive succeeded." ;;
            *) echo "::error::Unexpected status $code from Supabase."; exit 1 ;;
          esac
